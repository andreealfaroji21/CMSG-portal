<script>
        // ========================================================
        // 1. KONFIGURASI SUPABASE (HARUS DITARUH PALING ATAS)
        // ========================================================
        const SUPABASE_URL = "https://wpjwoogpvmuguutwtuxj.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indwandvb2dwdm11Z3V1dHd0dXhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNDM3NDAsImV4cCI6MjEwNTYxOTc0MH0.iY7ekod54fU1Dtdw8_eeO65G_W6UVQJzCz8SgbfYaIQ";
        const ADMIN_PIN_RAHASIA = "123456";

        // Inisialisasi client Supabase secara global sebelum fungsi dipanggil
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allPelangganList = [];
        let selectedPelangganAdmin = null;

        // ========================================================
        // 2. FUNGSI AUTENTIKASI & KONTROL ADMIN
        // ========================================================
        function loginAdmin() {
            const nama = document.getElementById('inputNamaPetugas').value.trim();
            const pin = document.getElementById('inputPinAdmin').value.trim();
            const err = document.getElementById('errorLogin');

            if (!nama) {
                err.innerText = "Masukkan Nama Petugas Admin.";
                err.classList.remove('hidden');
                return;
            }

            if (pin === ADMIN_PIN_RAHASIA) {
                document.getElementById('badgeNamaPetugas').innerText = nama;
                document.getElementById('loginAdminSection').classList.add('hidden');
                document.getElementById('dashboardAdminSection').classList.remove('hidden');
                document.getElementById('adminUserBadge').classList.remove('hidden');
                err.classList.add('hidden');
                
                // Memanggil data master setelah login berhasil
                loadMasterData();
            } else {
                err.innerText = "PIN Keamanan Admin Salah.";
                err.classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            document.getElementById('dashboardAdminSection').classList.add('hidden');
            document.getElementById('adminUserBadge').classList.add('hidden');
            document.getElementById('loginAdminSection').classList.remove('hidden');
            document.getElementById('inputNamaPetugas').value = '';
            document.getElementById('inputPinAdmin').value = '';
            tutupModal();
        }

        async function loadMasterData() {
            try {
                const { data: pelangganList, error } = await supabaseClient
                    .from('pelanggan')
                    .select('*')
                    .order('nama_pelanggan', { ascending: true });

                if (error) {
                    alert("Gagal memuat data: " + error.message);
                    return;
                }

                allPelangganList = pelangganList || [];
                updateKPIs(allPelangganList);
                renderMasterTable(allPelangganList);
            } catch (err) {
                alert("Kesalahan Sistem: " + err.message);
            }
        }

        function updateKPIs(data) {
            const total = data.length;
            const tunggak = data.filter(p => p.total_tunggakan > 0).length;
            const segelPutus = data.filter(p => p.status_tagihan_saat_ini.includes('Segel') || p.status_tagihan_saat_ini.includes('Pemutusan')).length;
            const totalRp = data.reduce((sum, p) => sum + Number(p.total_tunggakan || 0), 0);

            document.getElementById('statTotalPelanggan').innerText = total;
            document.getElementById('statPelangganTunggak').innerText = tunggak;
            document.getElementById('statSegelPutus').innerText = segelPutus;
            document.getElementById('statTotalTunggakan').innerText = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(totalRp);
        }

        function renderMasterTable(data) {
            const tbody = document.getElementById('masterPelangganTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="2" class="px-6 py-4 text-center text-slate-400 italic">Tidak ada nama pelanggan.</td></tr>';
                return;
            }

            data.forEach(p => {
                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-blue-50/50 transition";

                tr.innerHTML = `
                    <td class="px-6 py-3.5 font-bold text-slate-800 text-sm cursor-pointer hover:text-blue-700">
                        👤 ${p.nama_pelanggan}
                    </td>
                    <td class="px-6 py-3.5 text-right">
                        <button class="btn-detail bg-blue-900 hover:bg-blue-950 text-white font-medium px-3.5 py-1.5 rounded-lg text-xs transition shadow-sm">
                            Lihat Detail Data & Activity →
                        </button>
                    </td>
                `;

                const actionElement = tr.querySelector('.btn-detail');
                const nameElement = tr.querySelector('td');

                const openAction = () => bukaModalDetail(p);
                actionElement.addEventListener('click', openAction);
                nameElement.addEventListener('click', openAction);

                tbody.appendChild(tr);
            });
        }

        function filterMasterTable() {
            const keyword = document.getElementById('filterSearchTable').value.toLowerCase();

            const filtered = allPelangganList.filter(p => {
                return p.nama_pelanggan.toLowerCase().includes(keyword);
            });

            renderMasterTable(filtered);
        }

        async function bukaModalDetail(pelanggan) {
            selectedPelangganAdmin = pelanggan;
            
            document.getElementById('modalNamaPelanggan').innerText = pelanggan.nama_pelanggan;
            document.getElementById('modalNoPel').innerText = pelanggan.nomor_pelanggan;
            document.getElementById('modalWa').innerText = pelanggan.nomor_whatsapp || '-';
            document.getElementById('modalMeter').innerText = pelanggan.nomor_meter || '-';
            document.getElementById('modalAlamat').innerText = pelanggan.alamat || '-';

            document.getElementById('editStatusTagihan').value = pelanggan.status_tagihan_saat_ini;
            document.getElementById('editTotalTunggakan').value = pelanggan.total_tunggakan;

            await loadAdminTreatments(pelanggan.nomor_pelanggan);

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function tutupModal() {
            document.getElementById('detailModal').classList.add('hidden');
            selectedPelangganAdmin = null;
        }

        async function simpanUpdateStatus() {
            if (!selectedPelangganAdmin) return;

            const statusBaru = document.getElementById('editStatusTagihan').value;
            const tunggakanBaru = document.getElementById('editTotalTunggakan').value;

            const { error } = await supabaseClient
                .from('pelanggan')
                .update({ 
                    status_tagihan_saat_ini: statusBaru,
                    total_tunggakan: tunggakanBaru
                })
                .eq('nomor_pelanggan', selectedPelangganAdmin.nomor_pelanggan);

            if (error) {
                alert("Gagal memperbarui status: " + error.message);
            } else {
                alert("Status tagihan berhasil diperbarui!");
                selectedPelangganAdmin.status_tagihan_saat_ini = statusBaru;
                selectedPelangganAdmin.total_tunggakan = tunggakanBaru;
                await loadMasterData();
            }
        }

        async function tambahTreatmentBaru() {
            if (!selectedPelangganAdmin) return;

            const tgl = document.getElementById('inputTanggalTreatment').value;
            const jenis = document.getElementById('inputJenisTreatment').value;
            const ket = document.getElementById('inputKetTreatment').value.trim();

            if (!tgl) {
                alert("Pilih tanggal tindakan terlebih dahulu.");
                return;
            }

            const { error } = await supabaseClient
                .from('historis_treatment')
                .insert([{
                    nomor_pelanggan: selectedPelangganAdmin.nomor_pelanggan,
                    tanggal_treatment: tgl,
                    jenis_treatment: jenis,
                    keterangan: ket
                }]);

            if (error) {
                alert("Gagal menambah treatment: " + error.message);
            } else {
                alert("Treatment baru berhasil ditambahkan!");
                document.getElementById('inputKetTreatment').value = '';
                await loadAdminTreatments(selectedPelangganAdmin.nomor_pelanggan);
            }
        }

        async function loadAdminTreatments(nomorPelanggan) {
            const tbody = document.getElementById('adminTreatmentLogBody');
            tbody.innerHTML = '';

            const { data: treatments } = await supabaseClient
                .from('historis_treatment')
                .select('*')
                .eq('nomor_pelanggan', nomorPelanggan)
                .order('tanggal_treatment', { ascending: false });

            if (!treatments || treatments.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-3 py-3 text-center text-slate-400 italic">Belum ada riwayat treatment.</td></tr>';
                return;
            }

            treatments.forEach(item => {
                const dateFormatted = new Date(item.tanggal_treatment).toLocaleDateString('id-ID', {
                    day: 'numeric', month: 'short', year: 'numeric'
                });

                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="px-3 py-2 font-medium text-slate-800">${dateFormatted}</td>
                    <td class="px-3 py-2 font-bold text-blue-900">${item.jenis_treatment}</td>
                    <td class="px-3 py-2 text-slate-600">${item.keterangan || '-'}</td>
                    <td class="px-3 py-2 text-center">
                        <button class="btn-hapus text-[10px] bg-red-100 hover:bg-red-200 text-red-700 px-2 py-0.5 rounded">
                            Hapus
                        </button>
                    </td>
                `;

                tr.querySelector('.btn-hapus').addEventListener('click', () => hapusTreatment(item.id));
                tbody.appendChild(tr);
            });
        }

        async function hapusTreatment(idTreatment) {
            if (!confirm("Apakah Anda yakin ingin menghapus data treatment ini?")) return;

            const { error } = await supabaseClient
                .from('historis_treatment')
                .delete()
                .eq('id', idTreatment);

            if (error) {
                alert("Gagal menghapus treatment: " + error.message);
            } else {
                alert("Treatment berhasil dihapus.");
                await loadAdminTreatments(selectedPelangganAdmin.nomor_pelanggan);
            }
        }
    </script>
